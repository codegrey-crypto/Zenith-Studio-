name: Android CI/CD Build and Release

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Ensure Gradle Wrapper Exists
      run: |
        if [ ! -f "gradlew" ]; then
          echo "Gradle wrapper missing from repository, generating a fresh wrapper layout..."
          gradle wrapper --gradle-version 8.4
        fi
        chmod +x gradlew

    - name: Compile and Build Debug APK
      run: ./gradlew assembleDebug --no-daemon

    - name: Upload Finished APK
      uses: actions/upload-artifact@v4
      with:
        name: Zenith-Studio-Debug
        path: app/build/outputs/apk/debug/*-debug.apk
        
