name: Android CI/CD Build and Release

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant Execute Permission to Gradle Wrapper
      run: chmod +x gradlew

    - name: Prepare environment files
      run: |
        touch .env
        echo "## Auto-generated by CI/CD workflow" > .env

    - name: Compile and Build Debug APK
      run: ./gradlew assembleDebug --stacktrace

    - name: Compile and Build Release APK
      run: ./gradlew assembleRelease --stacktrace
      continue-on-error: true # Release APK might require signing keys to build successfully

    - name: Organize Build Outputs
      run: |
        mkdir -p build-outputs
        find app/build/outputs/apk/ -name "*.apk" -exec cp {} build-outputs/ \;
        echo "Compiled APKs found:"
        ls -R build-outputs

    - name: Upload Build Outputs to Workflow Run Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: Compiled-Android-APKs
        path: build-outputs/

    - name: Push Compiled Build Outputs/APKs to Branch or Create Release
      if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
      uses: softprops/action-gh-release@v2
      with:
        tag_name: build-v${{ github.run_number }}
        name: Build Output v${{ github.run_number }}
        draft: false
        prerelease: false
        files: build-outputs/*.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
