name: Android CI/CD Build and Release

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Force Install Stable Gradle 8.4
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: 8.4

    - name: Compile and Build Debug APK
      run: gradle assembleDebug --stacktrace --info --no-daemon --no-configuration-cache


    - name: Upload Finished APK
      uses: actions/upload-artifact@v4
      with:
        name: Zenith-Studio-Debug
        path: app/build/outputs/apk/debug/*-debug.apk
        
